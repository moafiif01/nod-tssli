name: Notifications Cron

on:
  schedule:
    # run every 5 minutes to handle prayer reminder windows
    - cron: '*/5 * * * *'
  workflow_dispatch: {}

jobs:
  prayer-reminders:
    runs-on: ubuntu-latest
    steps:
      - name: Call prayer reminder (Supabase function preferred)
        env:
          DEPLOY_URL: ${{ secrets.DEPLOY_URL }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
          SUPABASE_FUNCTION_URL: ${{ secrets.SUPABASE_FUNCTION_URL }}
        run: |
          if [ -n "$SUPABASE_FUNCTION_URL" ]; then
            echo "Calling Supabase function send-notifications..."
            curl -fsS -X POST -H "Authorization: Bearer $CRON_SECRET" -H "Content-Type: application/json" -d '{}' "$SUPABASE_FUNCTION_URL" || echo "function call failed"
          elif [ -n "$DEPLOY_URL" ]; then
            echo "Calling prayer reminder endpoint..."
            curl -fsS -H "Authorization: Bearer $CRON_SECRET" "$DEPLOY_URL/api/cron/fajr-reminder" || echo "prayer call failed"
          else
            echo "No DEPLOY_URL or SUPABASE_FUNCTION_URL configured. Skipping."
          fi
