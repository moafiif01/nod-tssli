name: External Cron - Call Prayer Reminder

on:
  schedule:
    # every 10 minutes
    - cron: '*/10 * * * *'
  workflow_dispatch: {}

jobs:
  call-cron:
    runs-on: ubuntu-latest
    steps:
      - name: Call prayer reminder endpoint
        env:
          SITE_URL: ${{ secrets.SITE_URL }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          if [ -z "$SITE_URL" ] || [ -z "$CRON_SECRET" ]; then
            echo "Missing SITE_URL or CRON_SECRET secret. Please add them in repository settings.";
            exit 1;
          fi

          echo "Calling $SITE_URL/api/cron/fajr-reminder"
          # Save response body to file and capture HTTP status
          RESPONSE_FILE=response.json
          HTTP_STATUS=$(curl -s -w "%{http_code}" -H "Authorization: Bearer $CRON_SECRET" -o "$RESPONSE_FILE" "$SITE_URL/api/cron/fajr-reminder")
          echo "Response status: $HTTP_STATUS"
          echo "Response body:"
          cat "$RESPONSE_FILE" || true
          # Fail the job if server returned an error code
          if [ "$HTTP_STATUS" -ge 400 ]; then
            echo "Cron call failed with status $HTTP_STATUS";
            exit 1;
          fi
