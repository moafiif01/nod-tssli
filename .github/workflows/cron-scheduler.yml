name: External Cron - Call Prayer Reminder

on:
  schedule:
    # every 5 minutes (GitHub Actions minimum)
    - cron: '*/5 * * * *'
  workflow_dispatch: {}

jobs:
  call-cron:
    runs-on: ubuntu-latest
    steps:
      - name: Call prayer reminder endpoint
        env:
          SITE_URL: ${{ secrets.SITE_URL }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          if [ -z "$SITE_URL" ] || [ -z "$CRON_SECRET" ]; then
            echo "Missing SITE_URL or CRON_SECRET secret. Please add them in repository settings.";
            exit 1;
          fi

            for endpoint in "/api/cron/fajr-reminder" "/api/cron/challenge-reminder"; do
              echo "Calling $SITE_URL${endpoint}"
              RESPONSE_FILE=response.json
              HTTP_STATUS=$(curl -s -w "%{http_code}" -H "Authorization: Bearer $CRON_SECRET" -o "$RESPONSE_FILE" "$SITE_URL${endpoint}")
              echo "Response status: $HTTP_STATUS"
              echo "Response body:"
              cat "$RESPONSE_FILE" || true
              if [ "$HTTP_STATUS" -ge 400 ]; then
                echo "Cron call failed for $endpoint with status $HTTP_STATUS";
                exit 1;
              fi
            done
